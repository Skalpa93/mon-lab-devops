name: Build and Push to GitHub Packages

on:
  push:
    branches: [ "main" ] # Se déclenche quand on pousse du code sur la branche 'main'

jobs:
  pipeline-devops:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupération du code sur la machine virtuelle GitHub
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Connexion sécurisée au registre de conteneurs de GitHub (GHCR)
      - name: Connexion au Registre GitHub (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Construction de l'image et envoi vers le Registre
      - name: Build de l'image & Push vers le Registre
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Génère automatiquement le nom d'image en minuscules requis par GitHub
          tags: ghcr.io/${{ github.repository_owner }}/mon-lab-devops:latest